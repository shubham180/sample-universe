<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universe Explorer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌌 Universe Explorer</h1>
            <p>Discover the wonders of our solar system</p>
        </header>

        <div class="controls">
            <button id="pauseBtn" class="control-btn">Pause</button>
            <button id="resetBtn" class="control-btn">Reset</button>
            <input type="range" id="speedSlider" min="0.1" max="3" step="0.1" value="1" class="slider">
            <span id="speedLabel">Speed: 1x</span>
        </div>

        <canvas id="universeCanvas"></canvas>

        <div class="info-panel">
            <h2 id="planetName">Select a Planet</h2>
            <p id="planetInfo">Click on a planet to learn more about it</p>
        </div>

        <div class="legend">
            <div class="legend-item">
                <span class="legend-dot" style="background: radial-gradient(circle at 30% 30%, #FDB813, #FDB813);"></span>
                <span>Sun</span>
            </div>
            <div class="legend-item">
                <span class="legend-dot" style="background: #87CEEB;"></span>
                <span>Earth</span>
            </div>
            <div class="legend-item">
                <span class="legend-dot" style="background: #D2B48C;"></span>
                <span>Mars</span>
            </div>
            <div class="legend-item">
                <span class="legend-dot" style="background: #D4A574;"></span>
                <span>Venus</span>
            </div>
            <div class="legend-item">
                <span class="legend-dot" style="background: #C0A080;"></span>
                <span>Mercury</span>
            </div>
            <div class="legend-item">
                <span class="legend-dot" style="background: #DAA520;"></span>
                <span>Jupiter</span>
            </div>
            <div class="legend-item">
                <span class="legend-dot" style="background: #F4A460;"></span>
                <span>Saturn</span>
            </div>
            <div class="legend-item">
                <span class="legend-dot" style="background: #4FD0E7;"></span>
                <span>Uranus</span>
            </div>
            <div class="legend-item">
                <span class="legend-dot" style="background: #4166F5;"></span>
                <span>Neptune</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
